# Workspace: the pure library (crates/dock) and the egui program (crates/app-egui).
# `cargo run` and `cargo test` at this level use the default members.
[workspace]
resolver = "2"
members = ["crates/dock", "crates/app-egui"]
default-members = ["crates/dock", "crates/app-egui"]
# The winit spike is a separate crate with its own Cargo.lock until it is absorbed.
exclude = ["spikes/winit"]
