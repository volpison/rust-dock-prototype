[package]
name = "rust-dock-prototype"
version = "0.1.0"
edition = "2021"
description = "Prototype: Photoshop-style detachable panels as real OS windows, in pure Rust."

[lib]
name = "dock"
path = "src/lib.rs"

# src/layout.rs (the lib) uses no dependencies: it is pure logic.
# Only the window layer (src/main.rs, src/app.rs, src/panels.rs) uses these.
[dependencies]
eframe = "0.37.0"
egui_dock = "0.22.0"
