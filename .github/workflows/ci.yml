# Runs on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Script tests (docs check)
        run: node --test "scripts/*.test.mjs"

      - name: Docs links and index
        run: node scripts/check-docs.mjs

  # Windows is the platform the maintainer uses. Rust is already installed on the runner.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Formatting
        run: cargo fmt --all --check

      # crates/dock is pure logic and must stay free of dependencies.
      - name: dock has no dependencies
        run: |
          $deps = cargo tree -p dock --edges normal,build --prefix none | Select-Object -Skip 1
          if ($deps) { Write-Error "dock has dependencies: $deps"; exit 1 }

      # crates/toolkit is pure logic too.
      - name: toolkit has no dependencies
        run: |
          $deps = cargo tree -p toolkit --edges normal,build --prefix none | Select-Object -Skip 1
          if ($deps) { Write-Error "toolkit has dependencies: $deps"; exit 1 }

      # Builds the libraries, the program and the tests, then runs them.
      - name: Tests
        run: cargo test --locked

      # The winit program is not a default member, so it is built and tested on its own.
      - name: Tests (winit program)
        run: cargo test --locked -p rust-dock-winit

      # The winit spike is its own crate (spikes/winit), so the steps above do not cover it.
      - name: Formatting (winit spike)
        run: cargo fmt --check
        working-directory: spikes/winit

      - name: Build (winit spike)
        run: cargo build --locked
        working-directory: spikes/winit
